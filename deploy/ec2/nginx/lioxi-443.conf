# Appended to /home/ec2-user/lioxi-dashboard/frontend/nginx.conf (lioxi-dashboard-frontend-1, port 443).
# Upstreams are variables resolved through Docker DNS at request time, so nginx still starts and
# reloads when the FINN containers are down (the other sites on this server keep working).
server {
    listen 443 ssl;
    http2 on;
    server_name enam.cflowx.in;

    ssl_certificate /etc/letsencrypt/live/enam.cflowx.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/enam.cflowx.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $finn_api http://finn-api:4000;
    set $finn_web http://finn-web:3000;

    # Research progress is streamed over SSE, so the API path is never buffered.
    location /api/v1/ {
        proxy_pass $finn_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        gzip off;
    }

    location / {
        proxy_pass $finn_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}
