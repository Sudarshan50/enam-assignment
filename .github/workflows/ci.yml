name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: finn
          POSTGRES_PASSWORD: finn
          POSTGRES_DB: finn
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U finn -d finn"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://finn:finn@localhost:54329/finn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run db:migrate
      - run: npm run seed -w @finn/db
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npx tsc -p apps/api/tsconfig.json --noEmit
      - run: npx vitest run
      - run: npm run check-mocks -w @finn/web
      - run: npm run build -w @finn/web
        env:
          NEXT_PUBLIC_USE_MOCKS: "1"
